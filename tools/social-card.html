<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:Roboto,sans-serif;background:#050d1b;
background-image:radial-gradient(1100px 420px at 50% -120px,rgba(0,132,207,.32),transparent 72%);color:#9fb1d0;position:relative}
.g1{position:absolute;width:520px;height:520px;right:-140px;top:-160px;border-radius:50%;filter:blur(90px);background:radial-gradient(circle,rgba(0,174,239,.45),transparent 70%)}
.g2{position:absolute;width:560px;height:560px;left:-260px;bottom:-260px;border-radius:50%;filter:blur(90px);background:radial-gradient(circle,rgba(0,132,207,.35),transparent 70%)}
.wrap{position:relative;padding:72px 80px}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:64px;height:64px}
.brand span{font-size:34px;font-weight:500;color:#c9d6ea}
.pill{display:inline-flex;align-items:center;gap:10px;margin-top:54px;padding:8px 18px;border-radius:999px;font-size:20px;font-weight:600;color:#7fd8f7;background:rgba(0,174,239,.08);border:1px solid rgba(0,174,239,.28)}
.dot{width:10px;height:10px;border-radius:50%;background:#00aeef}
h1{margin-top:26px;font-size:72px;line-height:1.05;letter-spacing:-.02em;color:#fff;font-weight:700}
.acc{background:linear-gradient(110deg,#00aeef 0%,#6fd6ff 55%,#00aeef 100%);-webkit-background-clip:text;color:transparent}
.chips{display:flex;gap:12px;margin-top:40px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:10px;font-size:20px;font-weight:500;color:#c2d2ec;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1)}
.url{position:absolute;right:80px;bottom:56px;font-size:22px;color:#7fd8f7;font-weight:500}
</style></head><body><div class="g1"></div><div class="g2"></div>
<div class="wrap">
<div class="brand"><img src="../static/img/logo.png"><span>Cloider Docs</span></div>
<div class="pill"><span class="dot"></span>Dashboard, CLI, Terraform, API and MCP</div>
<h1><span class="acc">Build, deploy and scale</span><br>on Cloider</h1>
<div class="chips"><span class="chip">Apps</span><span class="chip">Kubernetes</span><span class="chip">Databases</span><span class="chip">Object Storage</span><span class="chip">Registry</span><span class="chip">DNS</span></div>
</div><div class="url">docs.cloider.com</div></body></html>
