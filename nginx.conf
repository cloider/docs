server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # trailingSlash is false, so /kubernetes/overview is kubernetes/overview.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "public, max-age=300";
    }

    # hashed by the build, safe to cache for good
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Markdown twins of every page and llms.txt, for AI tools
    location ~ \.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
        add_header Cache-Control "public, max-age=300";
        add_header X-Robots-Tag "noindex";
    }

    location ~ ^/llms(-full)?\.txt$ {
        types { }
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=300";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/markdown text/css application/javascript application/json image/svg+xml;
}
